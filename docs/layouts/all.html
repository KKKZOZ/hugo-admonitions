{{ define "main" }}
  {{ if .IsHome }}
    <div class="hero">
      <h1>{{ site.Title }}</h1>
      <p>{{ site.Params.description }}</p>
    </div>
  {{ else }}
    <h1>{{ .Title }}</h1>
  {{ end }}

  {{ with .TableOfContents }}
    <nav class="toc" aria-label="On this page">
      <strong>On this page</strong>
      {{ . }}
    </nav>
  {{ end }}

  {{ .Content }}
{{ end }}
